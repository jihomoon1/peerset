# Monthly peer-index refresh (blueprint §10.1, §18): download SEC's bulk files, rebuild
# data/peer-index.json, and open a "data: refresh peer index" PR if it changed. Merging
# the PR redeploys the site and keeps this scheduled workflow active (GitHub disables
# schedules on public repos after 60 days without activity).
#
# Needs the repo secret SEC_USER_AGENT (never printed; GitHub also masks it) and the
# setting "Allow GitHub Actions to create and approve pull requests". CI on a PR opened
# with GITHUB_TOKEN waits for a maintainer to click "Approve workflows to run".

name: Refresh peer index

on:
  schedule:
    - cron: "17 6 1 * *" # 06:17 UTC on the 1st, off the top of the hour
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: refresh-peer-index
  cancel-in-progress: false

jobs:
  refresh:
    name: refresh
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci

      - name: Build the peer index (three SEC requests, about 3 GB)
        env:
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
        run: >-
          npx tsx scripts/build-peer-index.ts
          --work-dir "$RUNNER_TEMP/peer-index"
          --summary "$RUNNER_TEMP/peer-index-summary.md"
          --min-listed 3000

      - name: Open a pull request if the index changed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if git diff --quiet -- data/peer-index.json; then
            echo "data/peer-index.json is unchanged; no pull request."
            exit 0
          fi
          branch="data/peer-index-$(date -u +%Y-%m-%d)-${GITHUB_RUN_ID}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$branch"
          git add data/peer-index.json
          git commit -m "data: refresh peer index"
          git push origin "$branch"
          gh pr create --base main --head "$branch" \
            --title "data: refresh peer index" \
            --body-file "$RUNNER_TEMP/peer-index-summary.md"
